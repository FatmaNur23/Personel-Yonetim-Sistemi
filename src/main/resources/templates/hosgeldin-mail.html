<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sistemimize Hoş Geldiniz</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px;">
<div style="background-color: white; padding: 30px; border-radius: 8px; max-width: 600px; margin: auto; border-top: 4px solid #2ecc71;">
    <h2 style="color: #2c3e50;">Merhaba <span th:text="${personelAd}">Personel</span>,</h2>

    <p>Şirketimize ve Personel Yönetim Sistemimize hoş geldin! Kaydın başarıyla oluşturuldu.</p>

    <div style="background-color: #f8f9fa; padding: 15px; border-left: 4px solid #3498db; margin: 20px 0;">
        <p style="margin: 0;"><strong>Departman:</strong> <span th:text="${departmanAd}">Belirtilmedi</span></p>
        <p style="margin: 0;"><strong>İşe Giriş Tarihi:</strong> <span th:text="${iseGiris}">Tarih</span></p>
    </div>

    <p>İyi çalışmalar dileriz.</p>
</div>
</body>
</html>
